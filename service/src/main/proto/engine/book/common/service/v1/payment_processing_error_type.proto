syntax = "proto3";

package engine.book.common.service.v1;

import "protoc-gen-openapiv2/options/annotations.proto";

option go_package = "engine.com/engine-partner-api/v1/book/common/service";
option java_package = "com.engine.book.common.v1.service";
option java_multiple_files = true;

// The category of a payment processing failure on [PaymentProcessingError].
enum PaymentProcessingErrorType {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_enum) = {
    title: "Book_Common_Service_PaymentProcessingErrorType_v1"
  };

  // Unspecified payment processing error type.
  PAYMENT_PROCESSING_ERROR_TYPE_UNSPECIFIED = 0;

  // A failure that does not match a more specific type.
  PAYMENT_PROCESSING_ERROR_TYPE_UNKNOWN = 1;

  // The account cannot cover the charge.
  // For example, a balance, credit, or transaction amount limit was exceeded.
  PAYMENT_PROCESSING_ERROR_TYPE_INSUFFICIENT_FUNDS = 2;

  // The issuer declined the payment without a more specific failure type.
  PAYMENT_PROCESSING_ERROR_TYPE_CARD_DECLINED = 3;

  // The payment card is expired.
  PAYMENT_PROCESSING_ERROR_TYPE_EXPIRED_CARD = 4;

  // Authorization reached the issuer or network, but the card or transaction is not allowed.
  // For example, merchant-category restrictions or an unsupported authentication flow.
  PAYMENT_PROCESSING_ERROR_TYPE_PURCHASE_TYPE_NOT_SUPPORTED = 5;
}
