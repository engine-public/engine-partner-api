syntax = "proto3";

package engine.book.common.service.v1;

import "protoc-gen-openapiv2/options/annotations.proto";

option go_package = "engine.com/engine-partner-api/v1/book/common/service";
option java_package = "com.engine.book.common.v1.service";
option java_multiple_files = true;

// The category of an invalid payment failure on [InvalidPaymentError].
enum InvalidPaymentErrorType {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_enum) = {
    title: "Book_Common_Service_InvalidPaymentErrorType_v1"
  };

  // Unspecified invalid payment error type.
  INVALID_PAYMENT_ERROR_TYPE_UNSPECIFIED = 0;

  // The provided payment method is not accepted for this request.
  INVALID_PAYMENT_ERROR_TYPE_PAYMENT_METHOD_UNSUPPORTED = 1;

  // The provided payment information is invalid.
  // For example, incorrect card details or missing / unusable payment info.
  INVALID_PAYMENT_ERROR_TYPE_INVALID_PAYMENT_INFO = 2;
}
