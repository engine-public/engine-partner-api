syntax = "proto3";

package engine.book.lodging.service.v1;

import "protoc-gen-openapiv2/options/annotations.proto";

import "engine/book/common/service/v1/error.proto";
import "engine/service/common/v1/error.proto";
import "engine/book/lodging/service/v1/modification_type.proto";

option go_package = "engine.com/engine-partner-api/v1/book/lodging/service";
option java_package = "com.engine.book.lodging.v1.service";
option java_multiple_files = true;

// Requests the execution of a single modification against a [BookingDetails].
message SubmitModificationRequest {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
    json_schema: {
      title: "Book_Lodging_Service_SubmitModificationRequest_v1"
    }
  };

  // The identifier of the [BookingDetails] to modify.
  string booking_id = 1;

  // The modification to apply. Exactly one variant must be set per request.
  oneof modification_type {
    // A change to the guests recorded on the [BookingDetails].
    .engine.book.lodging.service.v1.GuestNameModification guest_name = 2;

    // A shortening of the stay by adjusting the check-in and/or check-out dates.
    .engine.book.lodging.service.v1.StayShorteningModification stay_shortening = 3;
  }
}

// Returns the outcome of a [LodgingBookingService.SubmitModification] call.
//
// A response indicates the modification was accepted and routed to the appropriate
// handler. [SubmitModificationResponse.outcome.pending_support] is an accepted outcome —
// not an error — and means the modification will be processed manually by support.
message SubmitModificationResponse {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
    json_schema: {
      title: "Book_Lodging_Service_SubmitModificationResponse_v1"
    }
  };

  // The identifier assigned to the recorded modification. Stable for the lifetime of
  // the modification and used to correlate downstream events and support cases.
  string modification_id = 1;

  // Outcome details for the modification submission. Exactly one variant is set for a
  // valid response.
  oneof outcome {
    // The modification was applied successfully. Describes the result of the applied
    // modification.
    .engine.book.lodging.service.v1.ModificationResult completed = 2;

    // The modification was accepted but will be processed manually by support. Carries
    // the information to surface to the end partner.
    .engine.book.lodging.service.v1.SupportInfo pending_support = 3;
  }
}

// The result of a successfully applied modification.
message ModificationResult {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
    json_schema: {
      title: "Book_Lodging_Service_ModificationResult_v1"
    }
  };

  // The identifier of the [BookingDetails] that was modified.
  string booking_id = 1;

  // A human-readable summary of what changed on the [BookingDetails]. Intended for
  // display in partner-facing tooling and logs; not machine-parsable.
  string summary = 2;
}

// Information about a modification that has been handed off to support for manual processing.
message SupportInfo {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
    json_schema: {
      title: "Book_Lodging_Service_SupportInfo_v1"
    }
  };

  // A human-readable message describing the support handoff. Suitable for surfacing to
  // the partner's end user.
  string message = 1;
}

// Error details of a failed [LodgingBookingService.SubmitModification] call.
//
// Reserved for validation failures only. Support handoffs (price increases, supplier
// failures) are reported via [SubmitModificationResponse.outcome.pending_support], not as
// an error.
message SubmitModificationError {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
    json_schema: {
      title: "Book_Lodging_Service_SubmitModificationError_v1"
    }
  };

  oneof error {
    // Defined when the operation returns with a status of NOT_FOUND and no [BookingDetails]
    // exists for the given booking ID.
    .engine.service.common.v1.NotFoundError not_found = 1;

    // Defined when the operation returns with a status of FAILED_PRECONDITION and the
    // [BookingDetails] associated with the given booking ID cannot be modified, e.g. the
    // stay is in the past, it is already cancelled, or a prior modification is pending support.
    .engine.book.common.service.v1.InvalidStateError invalid_state = 2;
  }
}
