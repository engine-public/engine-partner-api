syntax = "proto3";

package engine.notification.service.v1;

import "protoc-gen-openapiv2/options/annotations.proto";
import "engine/notification/service/v1/error.proto";

option go_package = "engine.com/engine-partner-api/v1/notification/service";
option java_package = "com.engine.notification.v1.service";
option java_multiple_files = true;

// Rotates the HMAC signing secret for an event subscription.
// The previous secret remains valid for 24 hours after rotation.
message RotateSecretRequest {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
    json_schema: {
      title: "Notification_Service_RotateSecretRequest_v1"
    }
  };

  // Opaque identifier of the event subscription whose secret is being rotated.
  string subscription_id = 1;

  // Base64-encoded secret key used for HMAC signature verification.
  // If not provided, the server will generate one and return it in [RotateSecretResponse.secret].
  // The decoded key must be 24-75 bytes (32-100 base64 characters).
  optional string secret = 2 [(grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
    min_length: 32,
    max_length: 100
  }];
}

// Confirms rotation and returns the newly-active HMAC signing secret.
message RotateSecretResponse {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
    json_schema: {
      title: "Notification_Service_RotateSecretResponse_v1"
    }
  };

  // Opaque identifier of the event subscription whose secret was rotated.
  string subscription_id = 1;

  // Base64-encoded HMAC signing secret now in effect, generated by the server if not provided in the request.
  // The prior secret remains valid for verification for 24 hours.
  string secret = 2;
}

// Error details of a failed [NotificationManagementService.RotateSecret] call.
message RotateSecretError {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
    json_schema: {
      title: "Notification_Service_RotateSecretError_v1"
    }
  };

  oneof error {
    // The requested event subscription does not exist.
    .engine.notification.service.v1.SubscriptionNotFound subscription_not_found = 1;

    // The supplied `secret` is not valid base64 or decodes to a length outside the accepted range.
    .engine.notification.service.v1.InvalidSecret invalid_secret = 2;

    // The subscription's secrets have already been rotated the maximum number of times within the rolling 24-hour window.
    .engine.notification.service.v1.SecretRotationLimitReached secret_rotation_limit_reached = 3;
  }
}
