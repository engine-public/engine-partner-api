syntax = "proto3";

package engine.service;

option go_package = "engine.com/engine-partner-api/v1/service";
option java_package = "com.engine.service";
option java_multiple_files = true;

// Holds no types. Imports the google.rpc error detail types (BadRequest, ErrorInfo, ...) so the published descriptor
// set includes them: gateway gRPC-JSON transcoders can only render a google.rpc.Status as JSON when every detail type
// it carries is in the descriptor set, and otherwise return an empty body. Not unused; do not remove.
import "google/rpc/error_details.proto";
