syntax = "proto3";

package engine.notification.webhook.v1;

import "protoc-gen-openapiv2/options/annotations.proto";

option go_package = "engine.com/engine-partner-api/v1/notification/webhook";
option java_package = "com.engine.notification.v1.webhook";
option java_multiple_files = true;

// Webhook-specific details for an event delivery attempt. See [EventDeliveryAttempt].
message WebhookEventDeliveryAttempt {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
    json_schema: {
      title: "Notification_Webhook_WebhookEventDeliveryAttempt_v1"
    }
  };

  // Callback URI associated with the subscription called for this attempt.
  string callback_uri = 1;

  // HTTP status from the subscribed webhook URI when an HTTP response was received (e.g. 200, 404).
  // Omitted when the attempt failed before an HTTP response (timeout, connection, or TLS error)
  // or while [EventDeliveryAttempt.status] is PENDING.
  optional int32 response_status_code = 2;
}
