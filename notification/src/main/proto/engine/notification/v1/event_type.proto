syntax = "proto3";

package engine.notification.v1;

import "protoc-gen-openapiv2/options/annotations.proto";

option go_package = "engine.com/engine-partner-api/v1/notification";
option java_package = "com.engine.notification.v1";
option java_multiple_files = true;

// Event that occurred for a given entity.
enum EventType {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_enum) = {
    title: "Notification_EventType_v1"
  };

  EVENT_TYPE_UNSPECIFIED = 0;
  // The entity was created
  EVENT_TYPE_CREATED = 1;
  // The entity was updated.
  EVENT_TYPE_UPDATED = 2;
  // The entity was canceled.
  EVENT_TYPE_CANCELED = 3;
}
