syntax = "proto3";

package engine.shop.common.v1;

import "protoc-gen-openapiv2/options/annotations.proto";
import "engine/shop/common/v1/conditions_override_addon.proto";
import "engine/common/v1/price.proto";

option go_package = "engine.com/engine-partner-api/v1/shop/common";
option java_package = "com.engine.shop.v1.common";
option java_multiple_files = true;

// An optional add-on that may be purchased with a shop [Offer], or returned on [ConfirmOfferResponse].
message Addon {
  option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
    json_schema: {
      title: "Shop_Common_Addon_v1"
    }
  };

  // An opaque token identifying this add-on. Pass to [ConfirmOfferRequest.selected_addon_tokens]
  // when confirming an offer that includes this add-on.
  string addon_token = 1;

  // A short display name for the add-on. Intended for partner-facing shopping and confirmation UI.
  string title = 2;

  // An optional longer description of the add-on for display during shopping or confirmation.
  optional string summary = 3;

  // The surcharge charged when this add-on is purchased with the offer.
  // On shop [Offer.addons] this is indicative and may change before booking.
  // On [ConfirmOfferResponse.available_addons] this is the confirmed fee for this confirmation.
  .engine.common.v1.Surcharge fee = 4;

  oneof addon_type {
    // An add-on that overrides the offer's modification and cancellation [Conditions].
    .engine.shop.common.v1.ConditionsOverrideAddon conditions_override = 5;
  }
}
